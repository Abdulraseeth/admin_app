<div class="col-12">
  <mat-card>
    <mat-card-content>
      <!-- Header Section -->
      <div class="header row align-items-center mb-3">
        <div class="col-8">
          <mat-card-title class="title">Add User</mat-card-title>
        </div>
        <div class="col-4 text-right">
          <button mat-raised-button color="warn" class="back-button">Back</button>
        </div>
      </div>
      <mat-divider></mat-divider>

      <!-- Form Section -->
      <form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="mt-4">
        <div class="row">
          <!-- Name Field -->
          <div class="col-md-6 form-group mb-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Name</mat-label>
              <input matInput placeholder="Enter Name" formControlName="name" />
              <mat-error *ngIf="userForm.get('name')?.hasError('required')">
                Name is required.
              </mat-error>
              <mat-error *ngIf="userForm.get('name')?.hasError('minlength')">
                Name must be at least 3 characters.
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Email Field -->
          <div class="col-md-6 form-group mb-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" placeholder="Enter Email" formControlName="email" />
              <mat-error *ngIf="userForm.get('email')?.hasError('required')">
                Email is required.
              </mat-error>
              <mat-error *ngIf="userForm.get('email')?.hasError('email')">
                Enter a valid email.
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Phone Field -->
          <div class="col-md-6 form-group mb-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Phone</mat-label>
              <input matInput type="tel" placeholder="Enter Phone Number" formControlName="phone" />
              <mat-error *ngIf="userForm.get('phone')?.hasError('required')">
                Phone number is required.
              </mat-error>
              <mat-error *ngIf="userForm.get('phone')?.hasError('pattern')">
                Enter a valid 10-digit phone number.
              </mat-error>
            </mat-form-field>
          </div>

          <!-- Role Field -->
          <div class="col-md-6 form-group mb-3">
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Role</mat-label>
              <mat-select formControlName="role">
                <mat-option value="" disabled>Select a role</mat-option>
                <mat-option value="admin">Admin</mat-option>
                <mat-option value="editor">Editor</mat-option>
                <mat-option value="viewer">Viewer</mat-option>
              </mat-select>
              <mat-error *ngIf="userForm.get('role')?.hasError('required')">
                Role is required.
              </mat-error>
            </mat-form-field>
          </div>
        </div>

        <!-- Submit Button -->
        <div class="form-group text-right mt-3">
          <button mat-raised-button color="primary" type="submit" [disabled]="!userForm.valid">
            Submit
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>

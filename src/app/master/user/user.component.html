<div class="col-12">
  <mat-card>
    <mat-card-content>
      <div class="header row">
        <div class="col-10">
          <mat-card-title>User List</mat-card-title>
        </div>
        <div class="col-2">
          <button mat-raised-button color="primary" class="add-user-button" (click)="addUser()">Add User</button>

        </div>
        <!-- <mat-card-title>User List</mat-card-title> -->
      </div>
      <mat-divider></mat-divider>

      <table mat-table [dataSource]="users" class="mat-elevation-z8" style="width: 100%; margin-top: 10px;">
        <!-- ID Column -->
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef> ID </th>
          <td mat-cell *matCellDef="let user"> {{ user.id }} </td>
        </ng-container>

        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let user"> {{ user.name }} </td>
        </ng-container>

        <!-- Email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef> Email </th>
          <td mat-cell *matCellDef="let user"> {{ user.email }} </td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef> Actions </th>
          <td mat-cell *matCellDef="let user">
            <button mat-button color="primary" (click)="viewUser(user.id)">View</button>
            <button mat-button color="accent" (click)="editUser(user.id)">Edit</button>
            <button mat-button color="warn" (click)="deleteUser(user.id)">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
